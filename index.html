<!doctype html>
<!--
  ═══════════════════════════════════════════════════════════════════════════════
  Legacy Designs — homepage file (Vite entry: index.html, repo root)

  This is the file Google fetches to verify Search Console. The verification meta
  tag is on line ~13, inside <head>, before <body>.

  ⚠️  DO NOT DELETE the verification tag after verifying — removing it can
      un-verify the property and you lose the Search Console history view.

  ⚠️  If you already have an index.html, this REPLACES it. Check that
      <script src="/src/main.tsx"> points at your real entry file, and that
      your own classes/fonts/analytics are still there.
  ═══════════════════════════════════════════════════════════════════════════════
-->
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ─── Google Search Console verification ─────────────────────────────── -->
    <meta name="google-site-verification" content="QOjRKMcYq_fazu33FYDXZ1Kw3OfNHOIa_3vqg0tx6ao" />

    <!-- ─── Primary SEO tags ───────────────────────────────────────────────── -->
    <title>Website Design &amp; SEO Agency in Kolhapur | Legacy Designs</title>
    <meta
      name="description"
      content="Legacy Designs builds fast, SEO-ready websites for Kolhapur businesses — design, development and SEO under one roof. Get a free quote on WhatsApp today."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- You asked for this. Google has ignored meta keywords since 2009 and Bing can
         treat it as noise — keep it, but don't expect rankings from it. -->
    <meta
      name="keywords"
      content="website design kolhapur, website development kolhapur, seo company kolhapur, web designer kolhapur, digital marketing kolhapur, website design agency kolhapur, वेबसाइट डिझाईन कोल्हापूर"
    />
    <meta name="author" content="Legacy Designs" />
    <meta name="theme-color" content="#0b0b0a" />

    <!-- ─── Icons & manifest ───────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ─── Open Graph / social preview ────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Legacy Designs" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Website Design &amp; SEO Agency in Kolhapur | Legacy Designs" />
    <meta
      property="og:description"
      content="Fast, SEO-ready websites for Kolhapur businesses. Design, development and SEO under one roof."
    />
    <meta property="og:image" content="/og/home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Websites that turn Kolhapur browsers into paying customers" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Website Design &amp; SEO Agency in Kolhapur | Legacy Designs" />
    <meta
      name="twitter:description"
      content="Fast, SEO-ready websites for Kolhapur businesses. Design, development and SEO under one roof."
    />
    <meta name="twitter:image" content="/og/home.jpg" />

    <!-- ─── Preconnects (delete any you don't use) ─────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- ─── Organization schema (static, works before React runs) ──────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Legacy Designs",
        "description": "Website design, development and SEO management in Kolhapur, Maharashtra.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kolhapur",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "areaServed": ["Kolhapur", "Ichalkaranji", "Sangli", "Karad"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <h1>Legacy Designs — website design, development and SEO in Kolhapur</h1>
      <p>
        We build fast, SEO-ready websites for hospitals, restaurants, boutiques, manufacturers and service
        businesses across Kolhapur, Ichalkaranji and Sangli.
      </p>
      <p>Enable JavaScript to view the portfolio, or call or WhatsApp us to enquire.</p>
    </noscript>

    <!-- ⚠️ Point this at YOUR entry file (main.tsx / main.tsx / index.tsx) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
